{% extends 'core/base.html' %}

{% block content %}
	<div class="bg-gradient-to-br from-green-100 via-green-300 to-green-300 min-h-screen flex items-center justify-center">

  <!-- Login Card -->
  <div class="card w-96 bg-white shadow-xl rounded-lg">
    <div class="card-body">
      <h2 class="text-center text-2xl font-bold text-gray-700">Welcome</h2>
      <p class="text-center text-gray-500 mb-4">Login to Buscapet</p>

      <!-- Login Form -->
      <div action="#" method="POST">
        <!-- Email Input -->
        <div class="form-control mb-4">
          <label class="label">
            <span class="label-text text-gray-600">Email Address</span>
          </label>
          <input type="email" placeholder="Enter your email" class="input input-bordered w-full" required />
        </div>

        <!-- Password Input -->
        <div class="form-control mb-4">
          <label class="label">
            <span class="label-text text-gray-600">Password</span>
          </label>
          <input type="password" placeholder="Enter your password" class="input input-bordered w-full" required />
        </div>

        <!-- Forgot Password Link -->
        <div class="text-right mb-4">
          <a href="#" class="text-sm text-indigo-500 hover:underline">Forgot password?</a>
        </div>

        <!-- Submit Button -->
        <button type="submit" class="btn btn-primary w-full">Login</button>
      </div>

      <!-- Divider -->
      <div class="divider my-6">OR</div>

      <!-- Social Login Buttons -->
      <button class="btn btn-outline btn-accent w-full mb-2">
        Login with Google
      </button>

      <!-- Signup Link -->
      <p class="text-center text-sm text-gray-500 mt-6">
        Don't have an account?
        <a href="{% url 'users:register' %}" class="text-indigo-500 hover:underline">Sign up here</a>.
      </p>
    </div>
  </div>

</div>
{% endblock %}
