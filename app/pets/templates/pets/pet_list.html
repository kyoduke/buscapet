{% extends 'core/base.html' %}
{% load i18n %}

{% block content %}
    <div class="flex flex-col ">
        <div class="w-full mx-auto max-w-7xl">
            <div class="flex">
                <aside class="hidden min-h-full pt-5 w-1/3 laptop:block">

                    <!-- Cursor: Change!! -->
                    <h2 class="text-lg font-bold text-left">Filtros</h2>
                    <div class="">
                        <div class="flex flex-col items-center justify-center h-full">
                            <form class="flex w-full flex-col items-start justify-between gap-4">
                                <div class="w-full">
                                    <label for="search" class="block text-sm font-medium text-gray-700 mb-1">{% translate 'Search by name' %}</label>
                                    <input type="text" id="search" name="search" class="w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-2 focus:ring-amber-500 focus:border-amber-500">
                                </div>

                                <div class="w-full">
                                    <label for="species" class="block text-sm font-medium text-gray-700 mb-1">{% translate 'Species' %}</label>
                                    <select id="species" name="species" class="w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-2 focus:ring-amber-500 focus:border-amber-500">
                                        <option value="">{% translate 'All' %}</option>
                                        <option value="0">{% translate 'Other' %}</option>
                                        <option value="1">{% translate 'Dog' %}</option>
                                        <option value="2">{% translate 'Cat' %}</option>
                                        <option value="3">{% translate 'Bird' %}</option>
                                    </select>
                                </div>

                                <div class="w-full">
                                    <label for="gender" class="block text-sm font-medium text-gray-700 mb-1">{% translate 'Gender' %}</label>
                                    <select id="gender" name="gender" class="w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-2 focus:ring-amber-500 focus:border-amber-500">
                                        <option value="">{% translate 'All' %}</option>
                                        <option value="0">{% translate 'Unknown' %}</option>
                                        <option value="1">{% translate 'Male' %}</option>
                                        <option value="2">{% translate 'Female' %}</option>
                                    </select>
                                </div>

                                <div class="w-full">
                                    <label for="status" class="block text-sm font-medium text-gray-700 mb-1">{% translate 'Status' %}</label>
                                    <select id="status" name="status" class="w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-2 focus:ring-amber-500 focus:border-amber-500">
                                        <option value="">{% translate 'All' %}</option>
                                        <option value="0">{% translate 'Lost' %}</option>
                                        <option value="1">{% translate 'Found' %}</option>
                                    </select>
                                </div>

                                <button type="submit" class="btn bg-green-400 w-full">
                                    {% translate 'Apply Filters' %}
                                </button>
                            </form>
                        </div>
                    </div>
                </aside>
                <div class="w-full mx-auto">
                    <div class="p-5">
                        <div>
{#                            <h2 class="text-gray-700">{% translate 'Pets' %}</h2>#}
                        </div>
                        <div class="grid w-full grid-cols-1 items-center justify-center gap-5 tablet:grid-cols-3">
                            {% for pet in pets %}
                                {% include 'pets/partials/pet_card.html' with pet=pet %}
                            {% endfor %}
                        </div>
                    </div>
                </div>
            </div>

        </div>
    </div>
{% endblock content %}
