{% extends 'core/base.html' %}
{% load i18n %}

{% block content %}
    <div class="flex flex-col ">
    <div class="w-full mx-auto max-w-7xl">
        <div class="flex">
            <aside class="hidden min-h-full w-1/3 bg-amber-200 laptop:block">
                <h2 class="text-lg font-bold text-left">Filtros</h2>
                <div class="p-1">
                <div class="flex flex-col items-center justify-center h-full">
                    <form class="flex w-full flex-col items-start justify-between gap-1">
                        <div>
                            <input type="text">
                        </div>
                    </form>
                    </div>
                </div>
            </aside>
            <div class="w-full mx-auto">
                <div class="p-5">
                    <div>
                        <h2>{% translate 'Pets' %}</h2>
                    </div>
                    <div class="grid w-full grid-cols-1 items-center justify-center gap-5 tablet:grid-cols-3">
                        {% for pet in pets %}
                            {% include 'pets/partials/pet_card.html' with pet=pet %}
                        {% endfor %}
                    </div>
                </div>
            </div>
        </div>

    </div>
    </div>
{% endblock content %}
