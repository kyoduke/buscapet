
services:
  web:
    container_name: buscapet_web
    build:
      context: .
      dockerfile: ./docker/web/Dev.Dockerfile
    env_file:
      - './env_files/.env'
    ports:
      - "8000:8000"
    networks:
      - buscapet_net
    depends_on:
      - db
    develop:
      watch:
        - path: ./app
          action: sync
          target: /buscapet/app
  db:
    image: postgres:17-alpine
    container_name: buscapet_database
    env_file:
      - './env_files/.env'
    volumes:
      - pg_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - buscapet_net

volumes:
  pg_data:
    driver: local

networks:
  buscapet_net:
    driver: bridge
